name: Refresh jobs daily

on:
  schedule:
    # 07:30 Toronto time (UTC-4) every day
    - cron: '30 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh jobs.json
        env:
          # Free keys at developer.adzuna.com — add them as repo secrets to make
          # the daily refresh pull brand-new postings with no manual step.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/refresh_jobs.py
      - name: Commit and push if changed
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No change to jobs.json"
          else
            git commit -m "chore: refresh jobs $(date -u +%F)"
            git push
          fi
      - name: Trigger Netlify deploy
        if: success()
        env:
          # Optional: Netlify Site settings -> Build & deploy -> Build hooks -> create one
          # named "jobs-refresh", then paste the URL as a repo secret.
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -X POST "$NETLIFY_BUILD_HOOK"
          else
            echo "No NETLIFY_BUILD_HOOK set — Netlify will still auto-deploy on the git push."
          fi
