name: Refresh jobs daily

on:
  schedule:
    # 07:30 Toronto time (UTC-4) every day
    - cron: '30 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh jobs.json
        env:
          # Optional: free keys at developer.adzuna.com, added as repo secrets,
          # for extra posting breadth on top of the keyless SmartRecruiters source.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/refresh_jobs.py
      - name: Commit and push if changed
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No change to jobs.json"
          else
            git commit -m "chore: refresh jobs $(date -u +%F)"
            git push
          fi
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            zip -q -r site.zip index.html jobs.json netlify.toml
            echo "Deploying to Netlify site $NETLIFY_SITE_ID ..."
            curl -s -X POST -H "Content-Type: application/zip" \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              --data-binary "@site.zip" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" | head -c 400
            echo ""
          else
            echo "No NETLIFY_AUTH_TOKEN secret set - skipping Netlify deploy (GitHub Pages still updates)."
          fi
